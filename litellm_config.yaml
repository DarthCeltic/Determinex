model_list:
  # ── DETERMINEX DSL-FINE-TUNED MODELS (Tier 0 — 6GB VRAM) ────────────────────
  # GGUFs downloaded to T:/determinex-models/versions/ on 2026-04-27.
  # Register with Ollama:
  #   ollama create determinex-engineer-v11-dsl -f T:/determinex-models/versions/engineer/v11-dsl/Modelfile.engineer-v11-dsl
  #   ollama create determinex-observer-v6-dsl  -f T:/determinex-models/versions/observer/v6-dsl/Modelfile.observer-v6-dsl
  #   ollama create determinex-sentinel-v5-dsl  -f T:/determinex-models/versions/sentinel/v5-dsl/Modelfile.sentinel-v5-dsl
  #
  # DSL fine-tune results (2026-04-27):
  #   Engineer v11-dsl:  pending micro_eval — ACCEPTED (provisional)
  #   Observer v6-dsl:   pending micro_eval — ACCEPTED (provisional)
  #   Sentinel v5-dsl:   pending micro_eval — ACCEPTED (provisional)
  #
  # Active production models (2026-04-27):
  #   determinex/engineer  → determinex-engineer-v11-dsl
  #   determinex/observer  → determinex-observer-v6-dsl
  #   determinex/sentinel  → determinex-sentinel-v5-dsl

  - model_name: determinex/engineer   # Builder: Qwen2.5-Coder-1.5B DSL v11
    litellm_params:
      model: ollama/determinex-engineer-v11-dsl
      api_base: http://localhost:11434

  - model_name: determinex/observer   # Monitor: Qwen2.5-3B DSL v6
    litellm_params:
      model: ollama/determinex-observer-v6-dsl
      api_base: http://localhost:11434

  - model_name: determinex/sentinel   # Sentinel: Mistral-7B DSL v5
    litellm_params:
      model: ollama/determinex-sentinel-v5-dsl
      api_base: http://localhost:11434

  - model_name: determinex/qwen7b    # Qwen2.5-Coder-7B base (no DSL fine-tune yet): oracle/architect candidate
    litellm_params:               # arch=qwen2, dim=3584 — already in rosetta_v1.pt
      model: ollama/qwen2.5-coder:7b-instruct
      api_base: http://localhost:11434

  # ── Remote GPU (vLLM) ────────────────────────────────────────────────────────
  # Any vLLM endpoint: an AMD Radeon Cloud instance, a rented box, a workstation on
  # the LAN. Pin it for one run without editing this file:
  #
  #   DETERMINEX_VLLM_BASE_URL=https://.../v1  DETERMINEX_VLLM_API_KEY=...  \
  #   DETERMINEX_ROLE_BUILDER=radeon/coder7b python scripts/determinex_hive.py run-session ...
  #
  # Base URL and key are read from the environment, never written here: the URL of a
  # cloud instance is ephemeral (it changes every time the tunnel restarts) and the key
  # is a credential. A committed value would be both stale and a leak.
  #
  # The `hosted_vllm/` prefix is REQUIRED and is the whole model name, org included --
  # `hosted_vllm/Qwen/Qwen2.5-Coder-7B-Instruct`, not `Qwen/...`. Passing the bare id is
  # what LiteLLM reports as "LLM Provider NOT provided", and it is exactly what
  # /v1/models hands you, so it is the natural thing to paste. See
  # determinex_providers._vllm_qualify.
  - model_name: radeon/coder7b       # measured 2026-08-02 on a live Radeon MI: ~34 candidates/s
    litellm_params:
      model: hosted_vllm/Qwen/Qwen2.5-Coder-7B-Instruct
      api_base: os.environ/DETERMINEX_VLLM_BASE_URL
      api_key: os.environ/DETERMINEX_VLLM_API_KEY

  # determinex/planner was offered in the IDE's role picker (aiRouting.ts) with no alias here, so
  # assigning it to a role yielded a model string litellm cannot route -- and `determinex/` is not a
  # provider it knows, so the failure is at call time, not at selection. Found 2026-07-31 by diffing
  # the picker's route ids against this file.
  #
  # It points at qwen7b rather than sentinel on purpose. Planner is the architect/oracle role, and
  # this project's standing rule is that the architect is qwen7b and NEVER sentinel -- sentinel is
  # the 7B Mistral DSL model, fine-tuned for escalation rather than for planning a DAG.
  - model_name: determinex/planner
    litellm_params:
      model: ollama/qwen2.5-coder:7b-instruct
      api_base: http://localhost:11434

  # ── GENERIC LOCAL MODELS (fallback / pre-DSL-finetune use) ───────────────
  # 2026-07-05: verified against live `ollama list` on this workstation.
  # The installed generic Qwen tags are the "-instruct" variants below; using
  # bare tags like "qwen2.5-coder:3b" causes Ollama "model not found" failures
  # during spec generation. `ollama list` / `curl localhost:11434/api/tags` is
  # the source of truth for what's actually callable.
  - model_name: local/fast
    litellm_params:
      model: ollama/qwen2.5-coder:3b-instruct
      api_base: http://localhost:11434

  - model_name: local/coder
    litellm_params:
      model: ollama/qwen2.5-coder:1.5b-instruct
      api_base: http://localhost:11434

  - model_name: local/smart
    litellm_params:
      model: ollama/mistral
      api_base: http://localhost:11434

  # ── OPENROUTER FREE MODELS (zero cost, requires OPENROUTER_API_KEY) ───────
  # OpenRouter is OpenAI-compatible: base_url = https://openrouter.ai/api/v1
  # All models tagged :free have $0 prompt/$0 completion pricing.
  # Best free models as of 2026-07-08 (sorted by quality for coding tasks):
  #
  #   qwen3-coder:free   — 480B MoE, 1M ctx, best free coding model (rivals GPT-4o)
  #   nemotron-ultra:free — 550B, 1M ctx, excellent reasoning
  #   gpt-oss-120b:free  — OpenAI OSS 120B, 131K ctx
  #   llama-3.3-70b:free — Meta Llama 3.3 70B, 131K ctx, great for review
  #   gemma-4-31b:free   — Google Gemma 4 31B, 262K ctx
  #
  # Recommended zero-cost role stack:
  #   oracle:    free/qwen3-coder   (planning + reasoning at massive scale)
  #   architect: free/qwen3-coder   (spec-to-DAG, 1M ctx fits entire codebase)
  #   builder:   free/qwen3-coder   (best free code generation available)
  #   monitor:   free/llama-3.3-70b (solid reviewer, won't share VRAM with builder)

  - model_name: free/qwen3-coder   # Qwen3 Coder 480B A35B — best free coding model, 1M ctx
    litellm_params:
      model: openrouter/qwen/qwen3-coder:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      extra_headers:
        HTTP-Referer: https://determinex.ai
        X-Title: Determinex IDE

  - model_name: free/nemotron-ultra  # NVIDIA Nemotron 3 Ultra 550B — massive reasoning, 1M ctx
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      extra_headers:
        HTTP-Referer: https://determinex.ai
        X-Title: Determinex IDE

  - model_name: free/gpt-oss-120b   # OpenAI OSS 120B — strong general, 131K ctx
    litellm_params:
      model: openrouter/openai/gpt-oss-120b:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      extra_headers:
        HTTP-Referer: https://determinex.ai
        X-Title: Determinex IDE

  - model_name: free/llama-3.3-70b  # Meta Llama 3.3 70B — excellent reviewer, 131K ctx
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      extra_headers:
        HTTP-Referer: https://determinex.ai
        X-Title: Determinex IDE

  - model_name: free/gemma-4-31b    # Google Gemma 4 31B — balanced, 262K ctx
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      extra_headers:
        HTTP-Referer: https://determinex.ai
        X-Title: Determinex IDE

  - model_name: free/nemotron-super  # NVIDIA Nemotron 3 Super 120B — strong, 1M ctx
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      extra_headers:
        HTTP-Referer: https://determinex.ai
        X-Title: Determinex IDE

  - model_name: free/cohere-code     # Cohere North Mini Code — code-focused, 256K ctx
    litellm_params:
      model: openrouter/cohere/north-mini-code:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      extra_headers:
        HTTP-Referer: https://determinex.ai
        X-Title: Determinex IDE

  # ── DEEPSEEK API (excellent price/performance for Oracle + Architect) ────
  - model_name: cloud/deepseek-chat    # DeepSeek-V3: best for planning/reasoning, ~$0.27/1M tokens
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com

  - model_name: cloud/deepseek-coder   # DeepSeek-Coder-V3: code-optimized, same price
    litellm_params:
      model: deepseek/deepseek-coder
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com

  # ── AMD RADEON GPU (ROCm) ────────────────────────────────────────────────
  # Two independent AMD paths. They use DIFFERENT key variables on purpose:
  # they are different operators on different hosts, and one key must never be
  # sent to the other's domain.

  # Path A — your own dedicated Radeon Cloud instance (vLLM on a Radeon GPU).
  # VERIFIED WORKING 2026-07-31: /models + chat/completions answered, and the
  # measured throughput behind Determinex's AMD evidence pack came from here.
  # Launch: radeon-global.anruicloud.com -> Profile -> Add Template
  #         Deploy Type = vLLM Model API
  # The instance dialog gives you a Base URL and an API key; both are per-instance
  # and die with the instance, so they live in .env, never in this file.
  - model_name: amd/qwen-coder-7b   # Qwen2.5-Coder-7B-Instruct on a Radeon GPU
    litellm_params:
      model: openai/Qwen/Qwen2.5-Coder-7B-Instruct
      api_base: os.environ/AMD_BASE_URL
      api_key: os.environ/AMD_API_KEY

  # Path B — AMD's free shared Token Factory endpoint.
  # UNVERIFIED from this machine: the Token Factory portal
  # (developer.amd.com.cn/radeon/modelapis) is a China-registered-account portal
  # and we have not obtained a key, so these two entries have never been executed.
  # They are left wired and honestly labelled rather than deleted or claimed.
  # Uses AMD_FREE_API_KEY — deliberately NOT AMD_API_KEY, so a dedicated-instance
  # key is never transmitted to this host.
  - model_name: amd/qwen3-35b       # Qwen3.6-35B-A3B on AMD ROCm (free tier)
    litellm_params:
      model: openai/Qwen3.6-35B-A3B
      api_base: https://developer.amd.com.cn/radeon/api/v1
      api_key: os.environ/AMD_FREE_API_KEY

  - model_name: amd/deepseek-flash  # DeepSeek-V4-Flash on AMD ROCm (free tier)
    litellm_params:
      model: openai/DeepSeek-V4-Flash
      api_base: https://developer.amd.com.cn/radeon/api/v1
      api_key: os.environ/AMD_FREE_API_KEY

  # ── CLOUD MODELS (optional — requires API keys in .env) ──────────────────
  - model_name: cloud/claude-fast
    litellm_params:
      model: claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: cloud/claude-best
    litellm_params:
      model: claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: cloud/claude-mid
    litellm_params:
      model: claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: cloud/gemini-flash
    litellm_params:
      model: gemini/gemini-3.1-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: cloud/gpt4o
    litellm_params:
      model: gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: cloud/mistral-large
    litellm_params:
      model: mistral/mistral-large-latest
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: cloud/groq-llama
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  # ── Added 2026-07-31 ──────────────────────────────────────────────────────
  # Ryan: "kimi, hf, vars ai, etc etc etc should all be configured in this".
  #
  # cloud/kimi-k2 is not new to the UI -- it was ALREADY offered in the role picker
  # (aiRouting.ts) and had no alias here, so assigning it to a role produced a model
  # string litellm cannot route. Found by diffing the picker's 21 route ids against
  # this file's aliases; determinex/planner below was the other one.
  - model_name: cloud/kimi-k2
    litellm_params:
      model: moonshot/kimi-k2-0711-preview
      api_key: os.environ/MOONSHOT_API_KEY

  # The rest are the providers registered in determinex_providers.py in the same pass.
  # A provider row makes a name resolvable in Python; an alias here is what makes it
  # assignable to a hive ROLE, which is the "decide who does what which llm" surface.
  - model_name: cloud/grok
    litellm_params:
      model: xai/grok-4
      api_key: os.environ/XAI_API_KEY

  # Google's OTHER surface. Deliberately separate from cloud/gemini-flash, which uses an
  # AI Studio key: Vertex authenticates with GCP service-account credentials. Google ended
  # Code Assist for individual accounts on 2026-07-31, so keeping both paths configured is
  # what leaves a Google model reachable when one of them closes to an account.
  - model_name: cloud/vertex-gemini
    litellm_params:
      model: vertex_ai/gemini-2.5-pro

  - model_name: cloud/codestral
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: cloud/together-qwen-coder
    litellm_params:
      model: together_ai/Qwen/Qwen2.5-Coder-32B-Instruct
      api_key: os.environ/TOGETHERAI_API_KEY

  - model_name: cloud/cerebras-qwen-coder
    litellm_params:
      model: cerebras/qwen-3-coder-480b
      api_key: os.environ/CEREBRAS_API_KEY

  - model_name: cloud/fireworks-qwen-coder
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/qwen3-coder-480b-a35b-instruct
      api_key: os.environ/FIREWORKS_AI_API_KEY

  - model_name: cloud/hf-qwen-coder
    litellm_params:
      model: huggingface/Qwen/Qwen2.5-Coder-32B-Instruct
      api_key: os.environ/HUGGINGFACE_API_KEY

router_settings:
  routing_strategy: "cost-based"
  fallbacks:
    - free/qwen3-coder:    [free/nemotron-ultra, free/gpt-oss-120b, local/fast]
    - free/nemotron-ultra: [free/qwen3-coder, free/gpt-oss-120b, local/smart]
    - free/llama-3.3-70b:  [free/gemma-4-31b, free/gpt-oss-120b, local/fast]
    - amd/qwen-coder-7b:   [local/coder, free/qwen3-coder, local/smart]
    - amd/qwen3-35b:       [free/qwen3-coder, local/smart]
    - amd/deepseek-flash:  [free/qwen3-coder, cloud/deepseek-chat]
    - cloud/claude-best:    [cloud/deepseek-chat, free/qwen3-coder, local/smart]
    - cloud/claude-fast:    [cloud/deepseek-chat, free/qwen3-coder, local/fast]
    - cloud/deepseek-chat:  [free/qwen3-coder, determinex/observer]
    - cloud/deepseek-coder: [free/qwen3-coder, determinex/engineer, local/coder]
    - determinex/engineer:     [local/coder, local/fast]
    - determinex/observer:     [local/fast]
    - determinex/sentinel:     [determinex/observer, local/smart]

# ── Determinex Hive Mind settings ────────────────────────────────────────────────
# These settings are read by determinex_hive.py, not LiteLLM directly.
# Edit these to match your setup — hardware tier, API tier, and model preferences.
determinex:

  # Role-to-model assignment.
  # The benchmark system (determinex_benchmark.py) auto-assigns these at install time.
  # You can override any assignment here. Use the model_name values from model_list above.
  # If a model_name refers to a local model and it is not running, the role falls back
  # to the first available fallback in router_settings.fallbacks.
  roles:
    # Canonical local stack (role-assignment canon: architect/oracle need the 7B —
    # the 1.5B produces empty plans as architect; see benchmark role scores).
    oracle:    determinex/qwen7b        # Local Qwen2.5-Coder-7B base
    architect: determinex/qwen7b        # Local Qwen2.5-Coder-7B base
    builder:   determinex/engineer      # Local Builder (Qwen2.5-Coder-1.5B DSL) — stays hot in VRAM
    monitor:   determinex/observer      # Local Monitor (Qwen2.5-3B DSL)
    # Rate-limit fallback (used 2026-07-08 E2E testing): set all four roles to
    # determinex/engineer to avoid OpenRouter limits — works, but architect quality drops.
    # Budget upgrade: switch oracle/architect to cloud/deepseek-chat or cloud/claude-best.

  # Builder escalation ladder for the Model Router (DETERMINEX_ROUTE=1).
  #
  # Cheapest first. The router gives each entry a verified-search budget against the
  # SAME Compiler Oracle and only escalates when that budget exhausts without a pass,
  # so a step the 1.5B can clear never reaches a bigger model -- and a step it cannot
  # escalates carrying its own compiler errors.
  #
  # Tier and cost are DERIVED from these names, not configured twice: determinex/* and
  # local/* are local Ollama (tier 1, no spend), free/* are free endpoints (tier 2, no
  # spend, real latency), cloud/* are paid (tier 3, priced from the usage ledger's own
  # table). An unrecognised prefix is assumed PAID, never free.
  #
  # This default is deliberately ALL-LOCAL, and that is now load-bearing rather than merely
  # thrifty: with DETERMINEX_ROUTE unset, routing turns ITSELF ON when the ladder is entirely
  # local AND the hardware tier can hold both rungs (tier 1+). Uncomment the cloud rung below
  # and routing goes back to requiring DETERMINEX_ROUTE=1 explicitly -- a derived default must
  # never be able to start spending money nobody authorised. DETERMINEX_ROUTE=0 forces off.
  # Needs 2+ entries -- one model cannot escalate (that case is DETERMINEX_AMPLIFY).
  builder_ladder:
    - determinex/engineer     # 1.5B DSL builder, stays hot in VRAM
    - determinex/qwen7b       # 7B base: the local escalation rung
    # - cloud/deepseek-chat   # uncomment to add a paid rung (~$0.27/1M tokens)

  # Rate limit profile for API-backed roles.
  # OpenRouter free tier: generous but shared. Using 1.5s inter_call_pause as safe default.
  # Tune inter_call_pause to match your API tier's tokens-per-minute limit.
  # Formula: inter_call_pause ≈ 60 / (your_RPM_limit * 0.8)  (80% of limit = safe headroom)
  #
  # Common profiles:
  #   OpenRouter free tier:       inter_call_pause: 1.5
  #   Anthropic free tier (~60 RPM):     inter_call_pause: 1.5
  #   Anthropic Build tier (~1000 RPM):  inter_call_pause: 0.1
  #   Google free tier (~60 RPM):        inter_call_pause: 1.5
  #   Google paid tier (~360 RPM):       inter_call_pause: 0.2
  #   OpenAI Tier 1 (~500 RPM):          inter_call_pause: 0.15
  rate_limits:
    inter_call_pause: 1.5            # seconds between consecutive API calls
    backoff_seconds: [5, 15, 30, 60, 120]  # per-attempt wait on 429
    max_retries: 5                   # 429s before build pauses and notifies user
    tpm_limit: 40000                 # tokens/minute ceiling for your API tier
    # Common tpm_limit values:
    #   OpenRouter free tier:   varies by model, ~40k TPM safe
    #   Anthropic free tier:    40,000 TPM  → tpm_limit: 40000
    #   Anthropic Build tier:  160,000 TPM  → tpm_limit: 160000
    #   Anthropic Scale tier:  400,000 TPM  → tpm_limit: 400000
    #   Google free tier:       32,000 TPM  → tpm_limit: 32000
    #   Google paid tier:      120,000 TPM  → tpm_limit: 120000
    # The limiter tracks a rolling 60s token window and sleeps proactively before
    # a call that would exceed this limit — prevents the 429 rather than reacting to it.

    # Per-provider overrides — if you use multiple API providers simultaneously
    # (e.g. Claude for Oracle, Gemini for Architect), set provider-specific pacing here.
    # Keys match the model prefix: "claude" → Anthropic, "gemini" → Google, "gpt" → OpenAI
    provider_overrides: {}
    # Example:
    # provider_overrides:
    #   anthropic:
    #     inter_call_pause: 0.1    # enterprise tier
    #   google:
    #     inter_call_pause: 1.5    # free tier

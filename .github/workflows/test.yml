name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, clean-main]
    paths:
      - 'scripts/**'
      - 'determinex_trainer/**'
      - 'tests/**'
      - 'locks/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'uv.lock'
      - '.pre-commit-config.yaml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'determinex_trainer/**'
      - 'tests/**'
      - 'locks/**'
      - 'frontend/src/**'
      - 'frontend/src-tauri/**'
      - 'frontend/package*.json'
      - 'frontend/vitest.config.ts'
      - 'frontend/.prettierrc.json'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'uv.lock'
      - '.pre-commit-config.yaml'
      - '.github/workflows/test.yml'

jobs:
  lint:
    name: Lint (ruff + pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pre-commit
        # The corpus-wiring-census hook is `language: system`, so it runs against THIS
        # environment's python. Without pydantic it could not import settings and reported
        # `bad_pointers=[{'pointer': 'settings.corpus_root', 'value': "<error: No module
        # named 'pydantic'>"}]` -- a guard failing on its own missing import while phrasing
        # it as a broken data-root pointer.
        run: pip install pre-commit pydantic pydantic-settings pyyaml
      - name: Run pre-commit hooks
        # SKIP=no-commit-to-branch: that hook's entire job is to reject a COMMIT made while
        # HEAD is on main. CI is checked out on main and is not committing anything, so the
        # hook fires on the branch name alone and can never pass here -- it is not reporting
        # a defect, it is reporting the checkout. Skipping it in CI does not weaken it where
        # it matters: it still runs on every local `git commit`, which is the only place a
        # commit-to-main can actually happen. Scoped to this one id so a real hook failure
        # still turns the job red.
        env:
          # This checkout IS the public mirror, which deliberately does not ship the vendored
          # trees under corpus/programbench/locked/. The two PB guards fail closed when they
          # cannot examine an archive -- correctly, because "nothing scannable" is
          # indistinguishable from "every archive vanished" and a guard must not guess that
          # absence is benign. So the filtered checkout DECLARES itself here, where the fact
          # is actually true, rather than in .pre-commit-config.yaml which the dev repo also
          # reads. The guards still fail if even one archive IS present (partial = drift), so
          # this cannot launder real drift.
          DETERMINEX_FILTERED_CHECKOUT: "1"
        run: SKIP=no-commit-to-branch pre-commit run --all-files

  doc-guard:
    name: Doc guard (mojibake + PB count)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ftfy
        run: pip install ftfy
      - name: Mojibake scan (fail on any found)
        run: python scripts/fix_mojibake.py --scan
      - name: ProgramBench lock count consistency
        run: python scripts/pb_doc_count_check.py

  security-audit:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        # Audit core deps only — bench/dev extras skipped (they include heavy ML stacks)
        run: |
          pip install -r requirements.txt --quiet
          pip-audit --desc --skip-editable

  python-tests:
    name: Python — pytest + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # [cloak] too, not just [dev]. Project Cloak's identifier extraction is a hard
          # tree-sitter dependency and degrades to NO obfuscation without the grammars --
          # CI reported it as "rust: identifiers leaked in plaintext: ['zzq_field',
          # 'zzq_param']" across 8 languages. The extra already lists all 10 grammars; it
          # simply was never installed here.
          pip install -e .[dev,cloak]
      - name: Pytest with coverage (gate ≥2%)
        env:
          DETERMINEX_ROOT: ${{ github.workspace }}
        # Gate is set at 2% — the CI environment lacks T:/ drive, Ollama, and GPU,
        # so most scripts are excluded by the "not integration and not slow" marks.
        # Current covered: determinex_settings.py, determinex_cli.py, determinex_doctor.py.
        # Target path to 60%: mock hardware-dependent checks; add portable unit tests
        # for corpus/, hive/, cloak/, and rosetta/ modules.
        run: |
          pytest tests/ -v --tb=short \
            -m "not integration and not slow" \
            --cov=scripts \
            --cov-report=term-missing \
            --cov-fail-under=2
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7
      - name: Compiler Oracle limits test
        env:
          DETERMINEX_ROOT: ${{ github.workspace }}
        run: python scripts/determinex_limits_test.py

  frontend-quality:
    name: Frontend (ESLint + Prettier + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        # `npm install`, not `npm ci`. The lockfile is generated on the Windows dev box, and
        # npm resolves some transitive natives differently per platform -- ci reported
        # "Missing: unique-slug@4.0.0 / isexe@3.1.5 / minipass@3.3.6 from lock file", all
        # node-gyp internals that a Windows resolution omits. `npm ci` demands byte-exact
        # cross-platform parity and fails closed on that skew; `npm install` reconciles it.
        # The correct long-term fix is to generate the lockfile on Linux (a container or a
        # CI job that commits it), at which point this can go back to `npm ci`.
        run: npm install --no-audit --no-fund
      - name: ESLint
        run: npx eslint .
      - name: Prettier check
        run: npm run format-check
      - name: Vitest smoke tests (≥10 tests)
        run: npm test
      # Shell smoke specs. @playwright/test was a dependency with zero specs for
      # months, so every UI check was a manual screenshot; these cover boot,
      # rail reachability, drawer navigation and content clipping.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Playwright shell specs
        run: npx playwright test

  rust-check:
    name: Rust (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      # Tauri links GTK/WebKit through -sys crates whose build scripts shell out to
      # pkg-config. Without these the build dies at `failed to run custom build command for
      # glib-sys` -- which reads like a Rust problem and is a missing apt package. The
      # Windows dev box has them via the WebView2 runtime, so this only ever fails here.
      - name: Install Tauri's Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            build-essential file pkg-config
      # tauri-build resolves `externalBin` at BUILD time and aborts with
      # `resource path 'bin/determinex-hive-x86_64-unknown-linux-gnu' doesn't exist` if the
      # sidecar is absent. The sidecar is a compiled artifact and is gitignored on purpose,
      # so it can never be in a fresh checkout. `cargo check` type-checks and never executes
      # it, so an empty placeholder is enough to get a real compile signal -- which is the
      # whole point of this job. A release build produces the real binary separately.
      - name: Stub the Tauri sidecar so tauri-build can resolve externalBin
        working-directory: frontend/src-tauri
        run: |
          mkdir -p bin
          : > bin/determinex-hive-x86_64-unknown-linux-gnu
          chmod +x bin/determinex-hive-x86_64-unknown-linux-gnu
      - name: cargo check
        working-directory: frontend/src-tauri
        run: cargo check --all-targets

  evidence-validate:
    name: Evidence integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal deps
        # --no-deps keeps this job fast, but the `determinex` entrypoint is a click app, so
        # it exited with `ModuleNotFoundError: No module named 'click'` before validating a
        # single evidence entry. Name the runtime deps the CLI actually needs rather than
        # dropping --no-deps and pulling the whole tree.
        run: |
          pip install -e . --no-deps
          pip install click pydantic pydantic-settings pyyaml
      - name: Validate evidence index (read-only)
        env:
          DETERMINEX_ROOT: ${{ github.workspace }}
        run: determinex evidence validate
      # REMOVED 2026-08-02: scripts/status/release_cell_drift_detector_workflow_guard.py
      # does not exist. Not "is unpublished" -- `git ls-files` finds no such path anywhere in
      # the repository, and scripts/status/ is not a directory. The only trace of it is three
      # evidence artefacts under
      # assurance/evidence/release_cell_drift_detector_github_workflow/ dated 2026-05-31,
      # which record a guard that has no code behind it. The step failed with
      # `python: can't open file ... [Errno 2]` and exit 2 -- a missing file, not a drift.
      # Restoring the guard means writing it; until then this step asserted nothing and
      # blocked the job. See the corpus class `evidence_without_an_artifact_behind_it`.

  arch-gauntlet:
    # ARCH_GAUNTLET_CI_LOCK_001 — witnesses the architecture / intake /
    # repair safety + portability invariants on Linux/Ubuntu, not only
    # Ryan's local Windows host. Runs the gauntlet in --strict mode plus
    # the focused test files for every architecture rung landed to date
    # (CONFIG_SPINE through HARDENED_REPAIR_PIPELINE_EXECUTORS).
    name: Architecture gauntlet + intake/repair safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          # [cloak] too, not just [dev]. Project Cloak's identifier extraction is a hard
          # tree-sitter dependency and degrades to NO obfuscation without the grammars --
          # CI reported it as "rust: identifiers leaked in plaintext: ['zzq_field',
          # 'zzq_param']" across 8 languages. The extra already lists all 10 grammars; it
          # simply was never installed here.
          pip install -e .[dev,cloak]
      - name: Run architecture regression gauntlet (--strict)
        env:
          # No Windows drive letter on CI; gauntlet's PATH_PORTABILITY
          # check handles this. No corpus writes allowed in CI.
          DETERMINEX_ROOT: ${{ github.workspace }}
          DETERMINEX_NO_CORPUS_WRITE: "1"
        run: |
          mkdir -p _ci_artifacts
          python scripts/dev/architecture_regression_gauntlet.py \
            --strict \
            --json _ci_artifacts/architecture_regression_gauntlet.json
      - name: Run focused architecture / intake / repair safety tests
        env:
          DETERMINEX_ROOT: ${{ github.workspace }}
          DETERMINEX_NO_CORPUS_WRITE: "1"
        run: |
          pytest -v --tb=short \
            tests/dev/test_architecture_regression_gauntlet_lock.py \
            tests/dev/test_parallel_execution_layer_audit_lock.py \
            tests/intake/test_codebase_explorer_smoke_lock.py \
            tests/intake/test_build_adapter_registry_lock.py \
            tests/intake/test_verifier_coverage_matrix_lock.py \
            tests/intake/test_hardened_intake_execution_runner_lock.py \
            tests/repair/test_hardened_repair_pipeline_executors_lock.py
      - name: Re-validate evidence index after gauntlet
        env:
          DETERMINEX_ROOT: ${{ github.workspace }}
        run: determinex evidence validate
      - name: Upload gauntlet JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-regression-gauntlet
          path: _ci_artifacts/architecture_regression_gauntlet.json
          retention-days: 30

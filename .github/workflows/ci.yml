name: Determinex CI

on:
  push:
    branches: [main, "sprint/*", "pb/*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Offline: no cloud AI calls during CI; local Ollama unavailable in GH runners.
  DETERMINEX_NETWORK_POLICY: "offline"
  # No corpus HMAC key in CI — ephemeral key is acceptable for tests.
  # Safety WAL and escalation state are temp-dir scoped by test fixtures.
  PYTHONPATH: scripts
  # ubuntu-latest ships a PEP 668 "externally-managed-environment" Python, which refused
  # `uv pip install --system` outright. Necessary but NOT sufficient: clearing PEP 668 only
  # revealed the next layer, "Permission denied" on the root-owned Debian site-packages.
  # The actual cure is the setup-python step each job now has; this stays because a job
  # added later without one should fail on permissions, which names the problem, rather
  # than on an externally-managed-environment error, which does not.
  UV_BREAK_SYSTEM_PACKAGES: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ">=0.4.0"
      # The other four jobs in this file already do this; lint was the only one that did
      # not, which is the entire reason it failed. Without it `--system` resolves to the
      # runner's root-owned Debian python (/usr/local/lib/python3.12/dist-packages) and the
      # install dies on "Permission denied (os error 13)". setup-python puts a writable
      # interpreter first on PATH, so --system means the one this job owns.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint deps
        run: uv pip install --system ruff
      - name: ruff check
        # W503 is a FLAKE8 rule ruff never implemented, so this command failed instantly
        # ("Unknown rule selector `W503`") on every run since it was written -- it lints
        # nothing, and it skips every downstream job. It only became visible as `failure`
        # rather than `startup_failure` once billing let CI actually run.
        #
        # Gating on E,F,W,I would fail on 2412 pre-existing findings, so it would go
        # straight back to permanently-red and stop being a signal. E9/F63/F7 (syntax
        # errors, broken comparisons, misplaced statements) is green today and is a real
        # gate: anything it catches is a bug, not a style opinion.
        #
        # DEFERRED, not dropped: F82 (undefined name) reports 85 findings, 76 of them in
        # determinex_projector.py / determinex_rosetta.py / rosetta_softprefix_smoke.py.
        # Those are real -- determinex_projector.py does not import at all
        # (NameError: PROJECTION_SAVE). Fix those, then add F82 here.
        run: ruff check scripts/ --select E9,F63,F7 --ignore E501

  unit-tests:
    name: Unit Tests (fast)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ">=0.4.0"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          uv pip install --system \
            pytest pytest-timeout \
            pydantic>=2.0 \
            structlog \
            hypothesis \
            duckdb \
            pyyaml \
            fastembed \
            numpy \
            psutil \
            httpx \
            litellm \
            tenacity \
            cryptography \
            click \
            pydantic-settings \
            requests \
            tqdm
          # These are the module-level third-party imports reachable from tests/ that were
          # NOT installed here. `tenacity` surfaced first as a collection ImportError, and
          # finding the rest one CI round trip at a time would have taken five more pushes,
          # so the set was computed by walking module-level imports across scripts/ and
          # subtracting stdlib, first-party and this list.
          #
          # Deliberately EXCLUDED: torch, transformers, peft, datasets. They are multi-GB
          # and belong to training paths; any test needing them should carry a `slow` or
          # `integration` marker, which this job already filters out. Installing them to
          # make a fast lane pass would make it not a fast lane.
      - name: Run fast unit tests
        run: |
          python -m pytest tests/ \
            -m "not slow and not integration and not hetzner and not docker" \
            -q --timeout=60 \
            --ignore=tests/corpus
          # NOT -x. Fail-fast stops at the first failure, so one CI run reveals exactly one
          # broken test and the next one needs another push and another ~4 minutes. Fixing a
          # class of failure that way costs one round trip per instance -- the evidence-tree
          # locks alone would have taken over a hundred. Report everything, fix in batches.

  governance-gates:
    name: Governance Gates
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ">=0.4.0"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: uv pip install --system pyyaml
      - name: ProgramBench board guard
        run: python scripts/pb_board_guard.py --guard
      - name: ProgramBench override scan
        run: python scripts/pb_override_scan.py --guard
      - name: PB doc count check
        run: python scripts/pb_doc_count_check.py --verbose

  synthesize-smoke:
    name: Oracle Synthesizer Smoke
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ">=0.4.0"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: uv pip install --system hypothesis pytest
      - name: Run synthesizer on canonical fixtures
        run: |
          python -m pytest tests/corpus/programbench/test_synthesize.py \
            -x -q --timeout=30 || true

  safety-smoke:
    name: Safety Layer Smoke
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ">=0.4.0"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: uv pip install --system pyyaml
      - name: Safety layer self-test
        run: python -m pytest tests/ -k "safety" -x -q --timeout=30 || true
      - name: Safety integrity check
        run: python scripts/determinex_safety.py integrity || true

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build — ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            args: "--target x86_64-pc-windows-msvc"
          - platform: macos-x86_64
            os: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: macos-aarch64
            os: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: linux-x86_64
            os: ubuntu-22.04
            args: "--target x86_64-unknown-linux-gnu"

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            ${{ matrix.platform == 'macos-aarch64' && 'aarch64-apple-darwin' || '' }}
            ${{ matrix.platform == 'macos-x86_64' && 'x86_64-apple-darwin' || '' }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: ${{ runner.os }}-${{ matrix.platform }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.platform }}-cargo-

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing (optional — add secrets to enable notarization)
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: "Determinex ${{ github.ref_name }}"
          releaseBody: |
            ## Determinex ${{ github.ref_name }}

            ### Quick Start

            **Prerequisites**: [Docker Desktop](https://docs.docker.com/get-docker/) and [Ollama](https://ollama.com/download) must be installed and running.

            1. Download the installer for your platform below
            2. Run the installer — Determinex installs like any desktop app
            3. Launch Determinex — it starts the Hive backend automatically
            4. Pull a model in Ollama: `ollama pull qwen2.5-coder:7b`

            See [README.md](https://github.com/${{ github.repository }}#readme) for full setup instructions.

            ---
            *Built from tag `${{ github.ref_name }}` · Compiler-verified, air-gapped, no telemetry*
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

# Determinex monitoring + ops stack (state-of-the-art self-hosted)
# Deploy on Hetzner: scp this + docker compose up -d
#
# Stack:
#   - uptime-kuma: service uptime monitoring (worker.sh, ollama, docker daemon)
#   - grafana: dashboards
#   - loki: log aggregation (replaces tail -f across multiple files)
#   - promtail: log shipper (reads /root/queue/_logs/*, /var/log/syslog)
#   - prometheus: metrics scraping
#   - cadvisor: container metrics
#   - postgres + pgvector: structured state + vector RAG (replaces JSON files)
#   - redis: queue (replaces /root/queue/*.txt with atomic ops)
#   - n8n: visual workflow automation for the regen → push → eval loop
#   - memos: knowledge base for findings
#   - vault: secret management (.env replacement)

name: determinex-ops

services:
  # ── Observability ──────────────────────────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: determinex-uptime-kuma
    restart: unless-stopped
    ports: ["3001:3001"]
    volumes:
      - uptime-kuma-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    image: grafana/grafana-oss:latest
    container_name: determinex-grafana
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning

  loki:
    image: grafana/loki:latest
    container_name: determinex-loki
    restart: unless-stopped
    ports: ["3100:3100"]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki

  promtail:
    image: grafana/promtail:latest
    container_name: determinex-promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /root/queue:/queue:ro
      - /root/determinex-programbench/_logs:/eval_logs:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml

  prometheus:
    image: prom/prometheus:latest
    container_name: determinex-prometheus
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: determinex-cadvisor
    restart: unless-stopped
    ports: ["8081:8080"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    privileged: true

  # ── State management ───────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: determinex-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=determinex
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-determinex_default_change_me}
      - POSTGRES_DB=determinex
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: determinex-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # ── Workflow + Knowledge ───────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: determinex-n8n
    restart: unless-stopped
    ports: ["5678:5678"]
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://${N8N_HOST:-localhost}:5678/
      - GENERIC_TIMEZONE=UTC
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n-data:/home/node/.n8n

  memos:
    image: neosmemo/memos:latest
    container_name: determinex-memos
    restart: unless-stopped
    ports: ["5230:5230"]
    volumes:
      - memos-data:/var/opt/memos

  # ── Secret management ──────────────────────────────────────────
  vault:
    image: hashicorp/vault:latest
    container_name: determinex-vault
    restart: unless-stopped
    ports: ["8200:8200"]
    cap_add: [IPC_LOCK]
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_ROOT_TOKEN:-determinex_dev_token}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://0.0.0.0:8200
    volumes:
      - vault-data:/vault/file

volumes:
  uptime-kuma-data:
  grafana-data:
  loki-data:
  prometheus-data:
  postgres-data:
  redis-data:
  n8n-data:
  memos-data:
  vault-data:

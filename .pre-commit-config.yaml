# NOTE: the vendored/evidence exclusion below is applied PER HOOK, deliberately.
#
# It started life as a top-level `exclude:`, which pre-commit applies to EVERY hook -- and
# three of the guards further down target `^corpus/programbench/...` on purpose:
# pb-lock-integrity, pb-anti-gaming and corpus-wiring-census. A top-level exclude would have
# switched all three off silently while the config still listed them, which is the corpus
# class `guard_shadowed_by_an_earlier_branch` verbatim: the documented behaviour never
# happens and nothing fails.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Trees these two formatting hooks must never rewrite:
      #   corpus/, work/  ~200 VENDORED UPSTREAM CHECKOUTS. Not our code. The Native
      #                   Reimplementation Loop feeds these to a model as the reference for
      #                   the real tool, so a faithful copy is the point; normalising someone
      #                   else's whitespace makes our reference diverge from upstream.
      #   assurance/      EVIDENCE -- a record of what the system actually emitted on a given
      #                   run, including `historical_*_snapshot.py`. Reformatting evidence
      #                   rewrites the thing the evidence is evidence OF.
      # Learned the hard way 2026-08-02: a whitespace pass over all tracked files touched
      # 5,054 corpus and 355 assurance files, and `ruff format` had already rewritten 83
      # evidence artifacts before assurance/ was excluded from ruff. All restored.
      - id: trailing-whitespace
        exclude: '^(corpus/|work/|assurance/|logs/eval_results/|dataset_generation/)'
      - id: end-of-file-fixer
        exclude: '^(corpus/|work/|assurance/|logs/eval_results/|dataset_generation/)'
      - id: check-yaml
      - id: check-json
        # tsconfig.json is JSONC -- the TypeScript compiler documents comments as
        # legal there, and check-json is a strict RFC 8259 parser. It reports
        # 'Expecting property name enclosed in double-quotes' on a file that is
        # valid for its own format. Excluded by exact name, not by extension.
        exclude: ^frontend/tsconfig\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
        # Two files contain PEM headers because their job is to FIND them: a secret
        # scanner and the test proving it rejects secret-shaped code. Flagging a
        # detector for containing what it detects is the same false positive that
        # made the mojibake guard fail on its own pattern table. Named exactly, so
        # a third file with a real key is still caught.
        exclude: ^(scripts/corpus/code_ingest/secret_scanner\.py|tests/corpus/test_secret_code_rejected\.py)$
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pinned to the ruff that actually formatted this repo. It was v0.11.12 while the local
    # toolchain ran 0.15.22 -- eight months apart -- so `ruff format` locally produced output
    # that `ruff format` in CI rejected, and the two could never agree no matter how many
    # times the formatter was run. Bumping the pin is the fix; leaving it would mean CI
    # checking the formatting against a formatter nobody uses.
    rev: v0.15.22
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-shell-true
        name: Reject subprocess shell=True
        language: pygrep
        entry: 'subprocess.*shell\s*=\s*True'
        types: [python]
        # The two REAL shell=True call sites (determinex_pb_autodrive.py) were removed
        # 2026-08-02 -- argv lists now, tokenization verified identical. What remains are
        # three files that must contain the string to do their job, which is the same false
        # positive as detect-private-key flagging the secret scanner:
        #   determinex_safety.py            the semgrep-style RULE that detects shell=True;
        #                                   its pattern/pattern-not lines are the rule text
        #   dev/parallel_execution_layer_audit.py  a comment enumerating call kinds it
        #                                   classifies ("subprocess.run", "os.system",
        #                                   "shell=True")
        #   publish_mirror.py               a docstring that says *not* to use it:
        #                                   "No shell=True (pre-commit forbids it)"
        # Named exactly, never by wildcard -- a fourth file with a real shell=True still fails.
        exclude: >-
          ^(tests/|docs/|dataset_generation/|scripts/determinex_safety\.py$|scripts/dev/parallel_execution_layer_audit\.py$|scripts/publish_mirror\.py$)

      - id: no-hardcoded-paths
        name: Reject hardcoded personal paths
        language: pygrep
        # THE PATTERN CAUGHT NOTHING (fixed 2026-08-02). It was
        #   '(C:\\\\Dev|C:/Dev|/Users/ryang|C:\\\\Users\\\\ryang)'
        # and YAML single-quotes pass backslashes through untouched, so the first branch is
        # the regex `C:\\\\Dev`, which requires TWO literal backslashes. Every real
        # occurrence has ONE -- `cwd=r"C:\Dev\Determinex"`, `r"C:\Users\ryang\AppData\..."` --
        # so the hook matched nothing, reported Passed on every run, and the paths shipped.
        # Measured: 13 files in live code, including three that hardcoded
        # C:\Users\ryang\AppData\Roaming\...\determinex.sqlite and two that hardcoded a
        # pythoncore python.exe. All fixed; this pattern is what would have caught them.
        # `[/\\]+` = one-or-more separators of either kind, so both slash styles and any
        # amount of escaping are covered.
        entry: '([Cc]:[/\\]+Dev|/Users/ryang|[Cc]:[/\\]+Users[/\\]+ryang)'
        types: [python]
        # archive/ is retired code the mirror does not publish; scripts/security and
        # scripts/hive contain COMMENTS quoting these paths to explain this very defect, and
        # rewriting the explanation would be the actual mistake.
        exclude: >-
          ^(tests/|docs/|dataset_generation/|corpus/|work/|scripts/archive/|tools/scratch_analyze\.py$|scripts/security/license_scan\.py$|scripts/hive/(api_client|manifest)\.py$|scripts/rebuild_corpus\.py$|scripts/programbench_eval_runner\.py$)

      - id: no-overclaim
        name: Reject authority-anchor overclaims (governance)
        language: system
        entry: python scripts/governance/overclaim_guard.py
        pass_filenames: false
        always_run: true

      # ── PB lock integrity (2026-06-15) — the structural 'never again' gate ──
      # A registered verified-lock whose archive tarball sha drifted = a lying
      # lock (the bulk-edit/bidir-strip degradation that made the board lie).
      # Block the commit until it is re-verified.
      - id: pb-lock-integrity
        name: Reject drifted PB verified-locks (sha must match the verified artifact)
        language: system
        entry: python scripts/determinex_pb_lock_registry.py check-integrity --guard
        pass_filenames: false
        files: '^corpus/programbench/(verified_locks\.json|locked/.*submission\.tar\.gz)$'

      # ── Anti-test-gaming (2026-06-16) — a lock must EARN its passes ────────
      # Reject any locked binary that DETECTS the test (reads PYTEST_CURRENT_TEST,
      # embeds goldens, branches on a literal test name) instead of implementing
      # the tool. yj was caught + demoted by this. Justify legit hits or fix.
      - id: pb-anti-gaming
        name: Reject test-gaming on locked tools (must implement, not detect the test)
        language: system
        entry: python scripts/determinex_pb_provenance_guard.py --guard
        pass_filenames: false
        files: '^corpus/programbench/(verified_locks\.json|provenance_justifications\.json|locked/.*)$'

      # ── Corpus wiring census (2026-07-18, widened 2026-07-19) — built-but-invisible guard ──
      # Every corpus artifact (in ANY corpus/<subcorpus>/ top level, not just
      # programbench -- widened 2026-07-19 after finding swebench/terminal_bench
      # orphans the old PB-only trigger pattern below would have missed
      # entirely) must have a code consumer (or an allowlisted reason), and
      # every declared data-root pointer must resolve NON-EMPTY. Guards the
      # July failure modes: canonical_tasks invisibility and the T: corpus
      # split-brain (defaults pointing at an empty skeleton).
      - id: corpus-wiring-census
        name: Reject unwired corpus artifacts / empty data-root pointers
        language: system
        entry: python scripts/corpus/corpus_wiring_census.py --guard
        pass_filenames: false
        files: '^(corpus/[^/]+/[^/]+\.(json|jsonl|tsv|gz|npy)|corpus/programbench/training_corpus/TRAINING_EXCLUSION\.json|scripts/corpus/corpus_wiring_census\.py|scripts/determinex_settings\.py|scripts/determinex_corpus_api\.py)$'

      # ── Mojibake / CRLF / BOM (2026-06-16) — Windows/encoding issues ───────
      # CRLF in a shell script killed dash ('set -e\r') and lied for hours.
      # Reject CRLF/BOM/U+FFFD/mojibake in source + dash-critical .sh at commit.
      - id: no-mojibake-crlf
        name: Reject CRLF / BOM / mojibake (Windows + encoding corruption)
        language: system
        entry: python scripts/determinex_pb_mojibake_guard.py
        types_or: [shell, python]
        exclude: '(fix_mojibake|mojibake_guard|fine_tuning|tokenizer)'

      # ── Single-source-of-truth (2026-06-16) — adapt, don't duplicate ───────
      # A canonical definition (FAMILY_PATTERNS, MECHANISMS, ...) may live in
      # exactly ONE module; others must import it. Caught the taxonomy dup.
      - id: no-duplicate-canonical
        name: Reject re-defining a canonical taxonomy/registry (adapt, don't add-on)
        language: system
        entry: python scripts/determinex_pb_dup_guard.py
        pass_filenames: false
        files: '^scripts/.*\.py$'

      # ── Absorbed from the hand-written hook (2026-08-04) ───────────────────
      # These three ran only from a bespoke `.git/hooks/pre-commit` shell script,
      # which is to say they ran NOWHERE: `core.hooksPath` pointed at
      # `C:\Dev\Citadel\.git\hooks`, a directory left behind by the rename that no
      # longer exists, so this repo had no hooks at all for an unknown period --
      # including the .env and API-key gates. pre-commit's migration mode cannot
      # rescue the script either, because it invokes the legacy hook through
      # `/bin/sh`, which does not exist on Windows. So the guards move here, where
      # one config is the single source of truth for what runs at commit time.
      #
      # The shell version fired all three whenever eval_index.json was staged;
      # `files:` expresses that same trigger declaratively.
      - id: pb-board-guard
        name: ProgramBench board is consistent with eval_index
        language: system
        entry: python scripts/pb_board_guard.py
        pass_filenames: false
        files: '^corpus/programbench/eval_index\.json$'

      - id: pb-doc-count-check
        name: ProgramBench doc counts match the index
        language: system
        entry: python scripts/pb_doc_count_check.py
        pass_filenames: false
        files: '^corpus/programbench/eval_index\.json$'

      - id: pb-override-scan
        name: No eval_override suppressing test collection in a strict lock
        language: system
        entry: python scripts/pb_override_scan.py --guard
        pass_filenames: false
        files: '^corpus/programbench/eval_index\.json$'

      # ── IDE surface map stays true (2026-08-04) — automap, not hand-map ────
      # The map of every IDE surface and every action inside it is CRAWLED from
      # the running app, never written by hand, so a screen added to the product
      # lands on the map and a deleted one leaves it. That only holds if the
      # committed doc and the committed snapshot cannot drift apart -- a doc that
      # is merely regenerable goes stale the first time someone skips the command,
      # which is exactly how the parallel-execution audit doc rotted behind a
      # green lock test. Refresh with: cd frontend && node scripts/ui_map_surfaces.mjs --sync
      - id: ui-surface-map-in-sync
        name: IDE surface map matches its crawled snapshot
        language: system
        entry: node frontend/scripts/ui_automap.mjs --check
        pass_filenames: false
        files: '^(frontend/ui-surface-map\.json|docs/ide-frontend/UI_SURFACE_MAP\.md|frontend/scripts/ui_automap\.mjs)$'

      # ── Secret hygiene (2026-06-14) — keep API keys / .env out of git ──────
      - id: no-env-file
        name: Reject committing .env (secrets stay on disk, never in git)
        language: fail
        entry: ".env must never be committed — it holds live API keys. It is gitignored; do not force-add it."
        files: '(^|/)\.env$'

      - id: no-api-keys
        name: Reject API-key-shaped strings (Anthropic / Google / OpenAI / generic)
        language: pygrep
        entry: '(sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{20}|AIzaSy[A-Za-z0-9_-]{30}|sk-[a-zA-Z0-9]{40,}|sk-proj-[A-Za-z0-9_-]{20})'
        # tests/corpus/test_secret_code_rejected.py exists to prove the corpus REJECTS
        # secret-shaped code, so it must contain secret-shaped code -- the same reason
        # ripsecrets ships 56 `sk_live_` samples. Named exactly, not by a `tests/` wildcard:
        # per the corpus class `scanner_exclusion_outlives_its_premise`, a broad exclusion
        # keeps applying after the premise stops being true, and the whole tests/ tree is
        # published. Every string in that file is a syntactic fake (`sk-aBcDe...`).
        exclude: '(^|/)(\.env\.example|.*\.lock|package-lock\.json|.*\.bak|tests/corpus/test_secret_code_rejected\.py)$'
